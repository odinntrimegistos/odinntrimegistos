<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f12"/>
      <stop offset="100%" stop-color="#151a1f"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00000000"/>
      <stop offset="100%" stop-color="#000000aa"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bfa66b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bfa66b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bfa66b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base obsidian/graphite gradient -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>

  <!-- Subtle temple grid lines -->
  <g opacity="0.15">
    <!-- vertical lines -->
    <g>
      <rect x="0" y="540" width="1920" height="2" fill="url(#gold)"/>
      <rect x="0" y="270" width="1920" height="1" fill="#bfa66b33"/>
      <rect x="0" y="810" width="1920" height="1" fill="#bfa66b33"/>
    </g>
    <!-- horizontal lines -->
    <g>
      <rect x="960" y="0" width="2" height="1080" fill="url(#gold)"/>
      <rect x="640" y="0" width="1" height="1080" fill="#bfa66b33"/>
      <rect x="1280" y="0" width="1" height="1080" fill="#bfa66b33"/>
    </g>
  </g>

  <!-- Soft vignette -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#vignette)"/>

  <!-- Center caduceus hint -->
  <g opacity="0.08">
    <circle cx="960" cy="540" r="200" fill="#bfa66b"/>
  </g>
</svg>
